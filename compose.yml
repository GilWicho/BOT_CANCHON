services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2-alpine
    container_name: canchon-lavalink
    restart: unless-stopped
    environment:
      LAVALINK_SERVER_PASSWORD: "${LAVALINK_PASSWORD}"
      _JAVA_OPTIONS: "-Xms128m -Xmx768m -XX:+UseG1GC -XX:MaxGCPauseMillis=100"
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - lavalink-youtube-plugin:/opt/Lavalink/plugins
    ports:
      - "127.0.0.1:2333:2333"
    cpus: 1.5
    mem_limit: 1g
    pids_limit: 256

volumes:
  lavalink-youtube-plugin:
